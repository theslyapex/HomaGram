name: homagram
description: HomaGram — Connection Beyond Boundaries.
publish_to: "none"
version: 0.2.1+3

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  supabase_flutter: 2.18.3
  image_picker: 1.2.2
  video_player: 2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Estedad
      fonts:
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 100
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 200
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 300
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 400
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 500
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 600
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 700
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 800
        - asset: assets/fonts/Estedad[wght].ttf
          weight: 900
