name: Prepare HomaGram signing secrets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download the already-generated signing key
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43070621711
          repository: theslyapex/HomaGram
          name: homagram-private-signing-key
          path: signing-package

      - name: Prepare GitHub secret value files
        shell: bash
        run: |
          set -euo pipefail
          test -s signing-package/homagram-upload.jks
          test -s signing-package/credentials.txt
          base64 -w0 signing-package/homagram-upload.jks > signing-package/ANDROID_KEYSTORE_BASE64.txt
          chmod 600 signing-package/ANDROID_KEYSTORE_BASE64.txt
          printf '%s\n' 'ANDROID_KEY_ALIAS=homagram-upload' > signing-package/ANDROID_KEY_ALIAS.txt
          grep '^ANDROID_STORE_PASSWORD=' signing-package/credentials.txt | cut -d= -f2- > signing-package/ANDROID_STORE_PASSWORD.txt
          grep '^ANDROID_KEY_PASSWORD=' signing-package/credentials.txt | cut -d= -f2- > signing-package/ANDROID_KEY_PASSWORD.txt
          chmod 600 signing-package/ANDROID_KEY_ALIAS.txt signing-package/ANDROID_STORE_PASSWORD.txt signing-package/ANDROID_KEY_PASSWORD.txt
      - name: Upload prepared secret files
        uses: actions/upload-artifact@v4
        with:
          name: homagram-github-secrets
          path: |
            signing-package/ANDROID_KEYSTORE_BASE64.txt
            signing-package/ANDROID_KEY_ALIAS.txt
            signing-package/ANDROID_STORE_PASSWORD.txt
            signing-package/ANDROID_KEY_PASSWORD.txt
          if-no-files-found: error
          retention-days: 1
